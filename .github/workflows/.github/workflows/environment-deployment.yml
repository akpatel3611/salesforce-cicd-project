name: Environment Deployment

on:
  workflow_dispatch:

jobs:

  deploy-dev:
    runs-on: ubuntu-latest
    environment: DEV

    steps:

      - name: Deploy DEV
        run: |
          echo "Deploying to DEV"

  deploy-sp:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: SP

    steps:

      - name: Deploy SP
        run: |
          echo "Deploying to SP"

  deploy-pod3:
    runs-on: ubuntu-latest
    needs: deploy-sp
    environment: POD3

    steps:

      - name: Deploy POD3
        run: |
          echo "Deploying to POD3"
