name: Salesforce Smart Deployment

on:
  workflow_dispatch:
    inputs:

      deploymentType:
        description: "Deployment Type"
        required: true
        type: choice
        options:
          - SpecificPR
          - SpecificComponent
          - FullDeploy

      prNumber:
        description: "PR Number only (Example: 41)"
        required: false

      componentName:
        description: "Component Name only (Example: accountViewer)"
        required: false

      targetEnvironment:
        description: "Target Org"
        required: true
        type: choice
        options:
          - DEV
          - SP
          - POD3

jobs:

  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.targetEnvironment }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CLI
        run: npm install @salesforce/cli --global

      - name: Install Delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Authenticate
        run: |

          if [ "${{ github.event.inputs.targetEnvironment }}" = "DEV" ]
          then
             echo "${{ secrets.DEV_ENVIRONMENT_SEC }}" > auth.txt
          elif [ "${{ github.event.inputs.targetEnvironment }}" = "SP" ]
          then
             echo "${{ secrets.SP_ENVIRONMENT_SEC }}" > auth.txt
          else
             echo "${{ secrets.POD3_ENVIRONMENT_SEC }}" > auth.txt
          fi

          sf org login sfdx-url \
          --sfdx-url-file auth.txt \
          --alias TARGETORG


      - name: Generate Package
        run: |

          TYPE="${{ github.event.inputs.deploymentType }}"

          if [ "$TYPE" = "SpecificPR" ]
          then

            git fetch origin pull/${{ github.event.inputs.prNumber }}/head:tempPR

            sf sgd source delta \
            --from HEAD \
            --to tempPR \
            --generate-delta \
            --output-dir .

          fi


      - name: Deploy
        run: |

          TYPE="${{ github.event.inputs.deploymentType }}"

          if [ "$TYPE" = "SpecificComponent" ]
          then

              COMPONENT="${{ github.event.inputs.componentName }}"

              sf project deploy start \
              --source-dir force-app/main/default/lwc/$COMPONENT \
              --target-org TARGETORG


          elif [ "$TYPE" = "SpecificPR" ]
          then

              sf project deploy start \
              --manifest package/package.xml \
              --target-org TARGETORG


          else

              sf project deploy start \
              --source-dir force-app \
              --target-org TARGETORG

          fi
