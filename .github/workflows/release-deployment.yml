name: Salesforce Smart Deployment

on:
  workflow_dispatch:
    inputs:

      deploymentType:
        description: "Deployment Type"
        required: true
        type: choice
        options:
          - SpecificPR
          - SpecificComponent
          - LatestMergeToMain
          - FullDeploy

      prNumber:
        description: "PR Number"
        required: false

      componentType:
        description: "Component Type"
        required: false
        type: choice
        options:
          - lwc
          - classes
          - triggers
          - flows
          - objects

      componentName:
        description: "Component Name"
        required: false

      targetEnvironment:
        description: "Target Org"
        required: true
        type: choice
        options:
          - DEV
          - SP
          - POD3

      testLevel:
        description: "Test Level"
        required: true
        type: choice
        options:
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
          - NoTestRun


jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Validate PR Input
        if: github.event.inputs.deploymentType == 'SpecificPR'
        run: |

          if [ -z "${{ github.event.inputs.prNumber }}" ]
          then
              echo "PR number required"
              exit 1
          fi


      - name: Validate Component
        if: github.event.inputs.deploymentType == 'SpecificComponent'
        run: |

          if [ -z "${{ github.event.inputs.componentName }}" ]
          then
              echo "Component name required"
              exit 1
          fi


  deploy:

    runs-on: ubuntu-latest

    needs: validate

    environment:
      name: ${{ github.event.inputs.targetEnvironment }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install CLI
        run: |

          npm install @salesforce/cli --global
          sf --version


      - name: Install Delta Plugin
        run: |

          yes | sf plugins install sfdx-git-delta


      - name: Authenticate
        run: |

          TARGET="${{ github.event.inputs.targetEnvironment }}"

          if [ "$TARGET" = "DEV" ]
          then
              echo "${{ secrets.DEV_ENVIRONMENT_SEC }}" > auth.txt

          elif [ "$TARGET" = "SP" ]
          then
              echo "${{ secrets.SP_ENVIRONMENT_SEC }}" > auth.txt

          else
              echo "${{ secrets.POD3_ENVIRONMENT_SEC }}" > auth.txt
          fi

          sf org login sfdx-url \
          --sfdx-url-file auth.txt \
          --alias TARGETORG

          rm auth.txt

          sf org display --target-org TARGETORG


      - name: Generate Package
        if: |
          github.event.inputs.deploymentType == 'SpecificPR' ||
          github.event.inputs.deploymentType == 'LatestMergeToMain'

        run: |

          mkdir -p package

          if [ "${{ github.event.inputs.deploymentType }}" = "SpecificPR" ]
          then

              git fetch origin pull/${{ github.event.inputs.prNumber }}/head:prBranch

              git fetch origin main

              BASE=$(git merge-base origin/main prBranch)

              sf sgd source delta \
              --from "$BASE" \
              --to prBranch \
              --output-dir package \
              --source-dir force-app

          else

              LATEST=$(git log --merges -1 --format="%H")

              PREVIOUS=$(git rev-parse ${LATEST}^1)

              sf sgd source delta \
              --from "$PREVIOUS" \
              --to "$LATEST" \
              --output-dir package \
              --source-dir force-app

          fi


          if [ -f package/package/package.xml ]
          then

             echo "PKG_PATH=package/package/package.xml" >> $GITHUB_ENV

          elif [ -f package/package.xml ]
          then

             echo "PKG_PATH=package/package.xml" >> $GITHUB_ENV

          fi



      - name: Validate Package

        if: env.PKG_PATH != ''

        run: |

          COMPONENT_COUNT=$(grep -c "<members>" "${{ env.PKG_PATH }}" || true)

          if [ "$COMPONENT_COUNT" -eq 0 ]
          then

              echo "No metadata found"

              exit 0

          fi


      - name: Deploy Package

        if: |
          (github.event.inputs.deploymentType == 'SpecificPR' ||
          github.event.inputs.deploymentType == 'LatestMergeToMain') &&
          env.PKG_PATH != ''

        run: |

          sf project deploy start \
          --manifest "${{ env.PKG_PATH }}" \
          --target-org TARGETORG \
          --test-level ${{ github.event.inputs.testLevel }} \
          --wait 30


      - name: Deploy Component

        if: github.event.inputs.deploymentType == 'SpecificComponent'

        run: |

          sf project deploy start \
          --source-dir force-app/main/default/${{ github.event.inputs.componentType }}/${{ github.event.inputs.componentName }} \
          --target-org TARGETORG \
          --test-level ${{ github.event.inputs.testLevel }} \
          --wait 30


      - name: Full Deploy

        if: github.event.inputs.deploymentType == 'FullDeploy'

        run: |

          sf project deploy start \
          --source-dir force-app \
          --target-org TARGETORG \
          --test-level ${{ github.event.inputs.testLevel }} \
          --wait 60
