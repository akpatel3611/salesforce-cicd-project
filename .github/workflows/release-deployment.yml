name: Salesforce Smart Deployment

on:
  workflow_dispatch:
    inputs:

      deploymentType:
        description: "Deployment Type"
        required: true
        type: choice
        options:
          - SpecificPR
          - SpecificComponent
          - LatestMergeToMain
          - FullDeploy

      prNumber:
        description: "PR Number — for SpecificPR only (Example: 41)"
        required: false

      componentType:
        description: "Component Type — for SpecificComponent only"
        required: false
        type: choice
        options:
          - lwc
          - classes
          - triggers
          - flows
          - objects
          - permissionsets
          - profiles
          - layouts
          - pages
          - staticresources
          - customMetadata

      componentName:
        description: "Component Name — for SpecificComponent only"
        required: false

      targetEnvironment:
        description: "Target Org"
        required: true
        type: choice
        options:
          - DEV
          - SP
          - POD3

      testLevel:
        description: "Apex Test Level"
        required: true
        type: choice
        options:
          - RunLocalTests
          - NoTestRun
          - RunSpecifiedTests
          - RunAllTestsInOrg



jobs:

  validate-inputs:

    name: Validate Inputs
    runs-on: ubuntu-latest

    steps:

      - name: Check SpecificPR inputs
        if: github.event.inputs.deploymentType == 'SpecificPR'
        run: |

          if [ -z "${{ github.event.inputs.prNumber }}" ]
          then
              echo "PR Number required"
              exit 1
          fi

          PR="${{ github.event.inputs.prNumber }}"

          if ! [[ "$PR" =~ ^[0-9]+$ ]]
          then
              echo "PR number invalid"
              exit 1
          fi


      - name: Check SpecificComponent inputs
        if: github.event.inputs.deploymentType == 'SpecificComponent'
        run: |

          if [ -z "${{ github.event.inputs.componentName }}" ]
          then
              echo "Component required"
              exit 1
          fi


      - name: Deployment Summary
        run: |

          echo "Mode : ${{ github.event.inputs.deploymentType }}"
          echo "PR : ${{ github.event.inputs.prNumber }}"
          echo "Component : ${{ github.event.inputs.componentName }}"
          echo "Environment : ${{ github.event.inputs.targetEnvironment }}"
          echo "Tests : ${{ github.event.inputs.testLevel }}"



  deploy:

    name: Deploy to ${{ github.event.inputs.targetEnvironment }}

    runs-on: ubuntu-latest

    needs: validate-inputs

    environment:
      name: ${{ github.event.inputs.targetEnvironment }}

    steps:


      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install Salesforce CLI
        run: |

          npm install @salesforce/cli --global
          sf --version


      - name: Install Delta Plugin
        run: |

          yes | sf plugins install sfdx-git-delta
          sf plugins


      - name: Authenticate Target Org
        run: |

          TARGET="${{ github.event.inputs.targetEnvironment }}"

          if [ "$TARGET" = "DEV" ]
          then
              echo "${{ secrets.DEV_ENVIRONMENT_SEC }}" > auth.txt

          elif [ "$TARGET" = "SP" ]
          then
              echo "${{ secrets.SP_ENVIRONMENT_SEC }}" > auth.txt

          else
              echo "${{ secrets.POD3_ENVIRONMENT_SEC }}" > auth.txt
          fi


          sf org login sfdx-url \
          --sfdx-url-file auth.txt \
          --alias TARGETORG

          rm -f auth.txt

          sf org list



      - name: Generate Package For PR
        if: github.event.inputs.deploymentType == 'SpecificPR'
        run: |

          mkdir -p package

          PR="${{ github.event.inputs.prNumber }}"

          git fetch origin pull/${PR}/head:prBranch

          git fetch origin main

          BASE=$(git merge-base origin/main prBranch)

          echo "Base commit:"
          echo $BASE

          sf sgd source delta \
          --from "$BASE" \
          --to prBranch \
          --output-dir package \
          --source-dir force-app

          ls -R package || true


          if [ -f package/package/package.xml ]
          then

             echo "PKG_PATH=package/package/package.xml" >> $GITHUB_ENV

          elif [ -f package/package.xml ]
          then

             echo "PKG_PATH=package/package.xml" >> $GITHUB_ENV

          else

             echo "PKG_PATH=" >> $GITHUB_ENV

          fi



      - name: Generate Latest Merge Package
        if: github.event.inputs.deploymentType == 'LatestMergeToMain'

        run: |

          mkdir -p package

          PREV=$(git rev-parse HEAD~1)

          CURR=$(git rev-parse HEAD)

          sf sgd source delta \
          --from "$PREV" \
          --to "$CURR" \
          --output-dir package \
          --source-dir force-app

          ls -R package || true


          if [ -f package/package/package.xml ]
          then

             echo "PKG_PATH=package/package/package.xml" >> $GITHUB_ENV

          elif [ -f package/package.xml ]
          then

             echo "PKG_PATH=package/package.xml" >> $GITHUB_ENV

          else

             echo "PKG_PATH=" >> $GITHUB_ENV

          fi



      - name: Deploy PR Package

        if: |
          github.event.inputs.deploymentType == 'SpecificPR' &&
          env.PKG_PATH != ''

        run: |

          sf project deploy start \
          --manifest "${{ env.PKG_PATH }}" \
          --target-org TARGETORG \
          --test-level ${{ github.event.inputs.testLevel }} \
          --wait 30



      - name: Deploy Latest Merge Package

        if: |
          github.event.inputs.deploymentType == 'LatestMergeToMain' &&
          env.PKG_PATH != ''

        run: |

          sf project deploy start \
          --manifest "${{ env.PKG_PATH }}" \
          --target-org TARGETORG \
          --test-level ${{ github.event.inputs.testLevel }} \
          --wait 30



      - name: Deploy Specific Component
        if: github.event.inputs.deploymentType == 'SpecificComponent'

        run: |

          TYPE="${{ github.event.inputs.componentType }}"
          NAME="${{ github.event.inputs.componentName }}"

          sf project deploy start \
          --source-dir force-app/main/default/$TYPE/$NAME \
          --target-org TARGETORG \
          --test-level ${{ github.event.inputs.testLevel }} \
          --wait 30



      - name: Full Deploy
        if: github.event.inputs.deploymentType == 'FullDeploy'

        run: |

          sf project deploy start \
          --source-dir force-app \
          --target-org TARGETORG \
          --test-level ${{ github.event.inputs.testLevel }} \
          --wait 60



      - name: Final Summary
        if: always()

        run: |

          echo "================================"
          echo "Deployment Status : ${{ job.status }}"
          echo "Deployment Type : ${{ github.event.inputs.deploymentType }}"
          echo "Target : ${{ github.event.inputs.targetEnvironment }}"
          echo "================================"
