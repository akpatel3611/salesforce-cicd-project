name: Salesforce Smart Deployment

on:
  workflow_dispatch:
    inputs:
      deploymentType:
        description: "Deployment Type"
        required: true
        type: choice
        options:
          - SpecificPR
          - SpecificComponent
          - LatestMergeToMain
          - FullDeploy

      prNumber:
        description: "PR Number"
        required: false

      componentType:
        description: "Component Type"
        required: false
        type: choice
        options:
          - lwc
          - classes
          - triggers
          - flows
          - objects

      componentName:
        description: "Component Name"
        required: false

      targetEnvironment:
        description: "Target Org"
        required: true
        type: choice
        options:
          - DEV
          - SP
          - POD3

      testLevel:
        description: "Test Level"
        required: true
        type: choice
        options:
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
          - NoTestRun

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Input
        if: github.event.inputs.deploymentType == 'SpecificPR'
        run: |
          if [ -z "${{ github.event.inputs.prNumber }}" ]
          then
              echo "PR number required"
              exit 1
          fi

      - name: Validate Component
        if: github.event.inputs.deploymentType == 'SpecificComponent'
        run: |
          if [ -z "${{ github.event.inputs.componentName }}" ]
          then
              echo "Component name required"
              exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: ${{ github.event.inputs.targetEnvironment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CLI
        run: |
          npm install @salesforce/cli --global
          sf --version

      - name: Install Delta Plugin
        run: |
          yes | sf plugins install sfdx-git-delta

      - name: Authenticate Target Org
        run: |
          TARGET="${{ github.event.inputs.targetEnvironment }}"

          if [ "$TARGET" = "DEV" ]; then
              echo "${{ secrets.DEV_ENVIRONMENT_SEC }}" > auth.txt
          elif [ "$TARGET" = "SP" ]; then
              echo "${{ secrets.SP_ENVIRONMENT_SEC }}" > auth.txt
          else
              echo "${{ secrets.POD3_ENVIRONMENT_SEC }}" > auth.txt
          fi

          sf org login sfdx-url --sfdx-url-file auth.txt --alias TARGETORG
          rm auth.txt
          sf org display --target-org TARGETORG

      - name: Generate Delta Package
        if: |
          github.event.inputs.deploymentType == 'SpecificPR' ||
          github.event.inputs.deploymentType == 'LatestMergeToMain'
        run: |
          mkdir -p package

          if [ "${{ github.event.inputs.deploymentType }}" = "SpecificPR" ]; then
              git fetch origin pull/${{ github.event.inputs.prNumber }}/head:prBranch
              git fetch origin main
              
              # Ensuring exactly the PR's code is present in working directory
              git checkout prBranch
              
              BASE=$(git merge-base origin/main HEAD)
              
              sf sgd source delta --from "$BASE" --to HEAD --output-dir package --source-dir force-app
              
          else
              git checkout main
              git pull origin main
              
              # Safe fallback logic for LatestMerge
              LATEST=$(git log --merges -1 --format="%H" 2>/dev/null || echo "")
              if [ -z "$LATEST" ]; then
                  LATEST=$(git rev-parse HEAD)
                  PREVIOUS=$(git rev-parse HEAD~1)
              else
                  PREVIOUS=$(git rev-parse ${LATEST}^1)
              fi
              
              sf sgd source delta --from "$PREVIOUS" --to "$LATEST" --output-dir package --source-dir force-app
          fi

      - name: Deploy Delta Package (PR or LatestMerge)
        if: |
          github.event.inputs.deploymentType == 'SpecificPR' ||
          github.event.inputs.deploymentType == 'LatestMergeToMain'
        run: |
          # Base deploy command with --ignore-conflicts to bypass sandbox tracking issues
          DEPLOY_CMD="sf project deploy start --target-org TARGETORG --test-level ${{ github.event.inputs.testLevel }} --wait 30 --ignore-conflicts"
          
          HAS_CHANGES=false

          # 1. Check if there are added/modified files
          if [ -f "package/package/package.xml" ] && grep -q "<members>" "package/package/package.xml"; then
              echo "✅ Found added/modified files in Delta."
              # FIX: Deploying the isolated folder directly instead of using manifest
              DEPLOY_CMD="$DEPLOY_CMD --source-dir package/force-app"
              HAS_CHANGES=true
          fi

          # 2. Check if there are deleted files (destructive changes)
          if [ -f "package/destructiveChanges/destructiveChanges.xml" ] && grep -q "<members>" "package/destructiveChanges/destructiveChanges.xml"; then
              echo "✅ Found deleted files (destructive changes)."
              DEPLOY_CMD="$DEPLOY_CMD --post-destructive-changes package/destructiveChanges/destructiveChanges.xml"
              HAS_CHANGES=true
          fi

          # 3. If no changes exist, exit gracefully without failing pipeline
          if [ "$HAS_CHANGES" = false ]; then
              echo "🚀 No metadata changes found to deploy. Pipeline exiting successfully."
              exit 0
          fi

          echo "Executing Deployment Command:"
          echo "$DEPLOY_CMD"
          
          # Run the dynamically built command
          eval $DEPLOY_CMD

      - name: Deploy Specific Component
        if: github.event.inputs.deploymentType == 'SpecificComponent'
        run: |
          sf project deploy start \
          --source-dir force-app/main/default/${{ github.event.inputs.componentType }}/${{ github.event.inputs.componentName }} \
          --target-org TARGETORG \
          --test-level ${{ github.event.inputs.testLevel }} \
          --wait 30 --ignore-conflicts

      - name: Full Deploy
        if: github.event.inputs.deploymentType == 'FullDeploy'
        run: |
          sf project deploy start \
          --source-dir force-app \
          --target-org TARGETORG \
          --test-level ${{ github.event.inputs.testLevel }} \
          --wait 60 --ignore-conflicts
