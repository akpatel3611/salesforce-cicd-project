name: Salesforce Smart Deployment

on:
  workflow_dispatch:
    inputs:
      deploymentType:
        description: "Deployment Type"
        required: true
        type: choice
        options:
          - SpecificPR
          - LatestMergeToMain
      prNumber:
        description: "PR Number (Required if SpecificPR is selected)"
        required: false
      targetEnvironment:
        description: "Target Org"
        required: true
        type: choice
        options:
          - DEV
          - SP
          - POD3
      testLevel:
        description: "Test Level"
        required: true
        type: choice
        options:
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
          - NoTestRun

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Input
        if: github.event.inputs.deploymentType == 'SpecificPR'
        run: |
          if [ -z "${{ github.event.inputs.prNumber }}" ]
          then
              echo "PR number required"
              exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: ${{ github.event.inputs.targetEnvironment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CLI
        run: |
          npm install @salesforce/cli --global
          sf --version

      - name: Install Delta Plugin
        run: |
          yes | sf plugins install sfdx-git-delta

      - name: Authenticate Target Org
        run: |
          TARGET="${{ github.event.inputs.targetEnvironment }}"

          if [ "$TARGET" = "DEV" ]; then
              echo "${{ secrets.DEV_ENVIRONMENT_SEC }}" > auth.txt
          elif [ "$TARGET" = "SP" ]; then
              echo "${{ secrets.SP_ENVIRONMENT_SEC }}" > auth.txt
          else
              echo "${{ secrets.POD3_ENVIRONMENT_SEC }}" > auth.txt
          fi

          sf org login sfdx-url --sfdx-url-file auth.txt --alias TARGETORG
          rm auth.txt
          sf org display --target-org TARGETORG

      - name: Generate Delta Package
        run: |
          mkdir -p delta-package

          if [ "${{ github.event.inputs.deploymentType }}" = "SpecificPR" ]; then
              git fetch origin pull/${{ github.event.inputs.prNumber }}/head:prBranch
              git fetch origin main
              git checkout prBranch
              BASE=$(git merge-base origin/main HEAD)
              sf sgd source delta --from "$BASE" --to HEAD --output-dir delta-package --source-dir force-app
          else
              git checkout main
              git pull origin main
              LATEST=$(git log --merges -1 --format="%H" 2>/dev/null || echo "")
              if [ -z "$LATEST" ]; then
                  LATEST=$(git rev-parse HEAD)
                  PREVIOUS=$(git rev-parse HEAD~1)
              else
                  PREVIOUS=$(git rev-parse ${LATEST}^1)
              fi
              sf sgd source delta --from "$PREVIOUS" --to "$LATEST" --output-dir delta-package --source-dir force-app
          fi

      - name: Preview Components to Deploy (Kon se component deploy honge?)
        run: |
          echo "=== DEPLOYMENT PREVIEW ==="
          if [ -f "delta-package/package.xml" ]; then
              echo "📄 New / Modified Components List:"
              cat delta-package/package.xml
          elif [ -f "delta-package/package/package.xml" ]; then
              echo "📄 New / Modified Components List:"
              cat delta-package/package/package.xml
          else
              echo "⚠️ No package.xml found."
          fi

          if [ -f "delta-package/destructiveChanges/destructiveChanges.xml" ]; then
              echo "🗑️ Deleted Components (Destructive Changes) List:"
              cat delta-package/destructiveChanges/destructiveChanges.xml
          elif [ -f "delta-package/destructiveChanges.xml" ]; then
              echo "🗑️ Deleted Components (Destructive Changes) List:"
              cat delta-package/destructiveChanges.xml
          else
              echo "⚠️ No destructive changes found."
          fi

      - name: Deploy Delta Package
        run: |
          # Dynamic parameters fetched from user choices
          DEPLOY_CMD="sf project deploy start --target-org TARGETORG --test-level ${{ github.event.inputs.testLevel }} --wait 30 --ignore-conflicts"
          HAS_CHANGES=false

          # Correct path detection for SGD output structure
          PKG_XML_PATH=""
          if [ -f "delta-package/package/package.xml" ]; then
              PKG_XML_PATH="delta-package/package/package.xml"
              SRC_DIR="delta-package/force-app"
          elif [ -f "delta-package/package.xml" ]; then
              PKG_XML_PATH="delta-package/package.xml"
              SRC_DIR="delta-package/force-app"
          fi

          # 1. Check & append added/modified components
          if [ -n "$PKG_XML_PATH" ] && grep -q "<members>" "$PKG_XML_PATH"; then
              echo "✅ Found added/modified files in Delta."
              # Deploying through manifest is safer for dynamic delta folders
              DEPLOY_CMD="$DEPLOY_CMD --manifest $PKG_XML_PATH"
              HAS_CHANGES=true
          fi

          # 2. Check & append deleted files
          DEST_XML_PATH=""
          if [ -f "delta-package/destructiveChanges/destructiveChanges.xml" ]; then
              DEST_XML_PATH="delta-package/destructiveChanges/destructiveChanges.xml"
          elif [ -f "delta-package/destructiveChanges.xml" ]; then
              DEST_XML_PATH="delta-package/destructiveChanges.xml"
          fi

          if [ -n "$DEST_XML_PATH" ] && grep -q "<members>" "$DEST_XML_PATH"; then
              echo "✅ Found deleted files (destructive changes)."
              DEPLOY_CMD="$DEPLOY_CMD --post-destructive-changes $DEST_XML_PATH"
              HAS_CHANGES=true
          fi

          # 3. Handle empty check
          if [ "$HAS_CHANGES" = false ]; then
              echo "🚀 No metadata changes found to deploy. Pipeline exiting successfully."
              exit 0
          fi

          echo "Executing Deployment Command:"
          echo "$DEPLOY_CMD"
          
          eval $DEPLOY_CMD
