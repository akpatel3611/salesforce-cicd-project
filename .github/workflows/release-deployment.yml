name: Salesforce Smart Deployment

on:
  workflow_dispatch:
    inputs:
      deploymentType:
        description: "Deployment Type"
        required: true
        type: choice
        options:
          - SpecificPR
          - LatestMergeToMain

      prNumber:
        description: "PR Number"
        required: false

      targetEnvironment:
        description: "Target Org"
        required: true
        type: choice
        options:
          - DEV
          - SP
          - POD3

      testLevel:
        description: "Test Level"
        required: true
        type: choice
        options:
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
          - NoTestRun

permissions:
  contents: read
  pull-requests: read

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Input Parameters
        if: github.event.inputs.deploymentType == 'SpecificPR'
        run: |

          if [ -z "${{ github.event.inputs.prNumber }}" ]
          then
              echo "ERROR : PR Number required"
              exit 1
          fi

  deploy:

    runs-on: ubuntu-latest
    needs: validate

    environment:
      name: ${{ github.event.inputs.targetEnvironment }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |

          npm install @salesforce/cli --global

          sudo apt-get update
          sudo apt-get install gh -y

          sf --version
          gh --version

      - name: Install Git Delta Plugin
        run: |

          yes | sf plugins install sfdx-git-delta

      - name: Authenticate Org
        run: |

          TARGET="${{ github.event.inputs.targetEnvironment }}"

          if [ "$TARGET" = "DEV" ]
          then
            echo "${{ secrets.DEV_ENVIRONMENT_SEC }}" > auth.txt

          elif [ "$TARGET" = "SP" ]
          then
            echo "${{ secrets.SP_ENVIRONMENT_SEC }}" > auth.txt

          else
            echo "${{ secrets.POD3_ENVIRONMENT_SEC }}" > auth.txt
          fi

          sf org login sfdx-url \
          --sfdx-url-file auth.txt \
          --alias TARGETORG

          rm auth.txt

          sf org display --target-org TARGETORG

      - name: Generate Delta Package

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          mkdir -p delta-package

          if [ "${{ github.event.inputs.deploymentType }}" = "SpecificPR" ]
          then

              PR="${{ github.event.inputs.prNumber }}"

              echo "Processing PR : $PR"

              BASE=$(gh pr view $PR --json baseRefOid --jq '.baseRefOid')
              HEAD=$(gh pr view $PR --json headRefOid --jq '.headRefOid')

          else

              echo "Finding latest merged PR"

              PR=$(gh pr list \
              --state merged \
              --limit 1 \
              --json number \
              --jq '.[0].number')

              BASE=$(gh pr view $PR --json baseRefOid --jq '.baseRefOid')
              HEAD=$(gh pr view $PR --json headRefOid --jq '.headRefOid')

          fi

          echo "Base : $BASE"
          echo "Head : $HEAD"

          sf sgd source delta \
          --from "$BASE" \
          --to "$HEAD" \
          --output-dir delta-package \
          --source-dir force-app \
          --generate-delta


          echo ""
          echo "================================="
          echo "Dynamic Metadata Scan"
          echo "================================="

          git diff --name-only "$BASE" "$HEAD" > changedFiles.txt

          cat changedFiles.txt


          while read FILE
          do

              FILE=$(echo "$FILE"|xargs)

              if [[ -z "$FILE" ]]
              then
                  continue
              fi

              if [[ ! "$FILE" == *.cls ]]
              then
                  continue
              fi

              if [[ ! -f "$FILE" ]]
              then
                  continue
              fi

              echo ""
              echo "Scanning Apex : $FILE"

              grep -o "[A-Za-z0-9_]*__c" "$FILE" | sort -u > objects.txt

              while read OBJECT
              do

                  OBJECT=$(echo "$OBJECT"|xargs)

                  if [[ -z "$OBJECT" ]]
                  then
                      continue
                  fi

                  echo "Detected : $OBJECT"

                  if [ -d "force-app/main/default/objects/$OBJECT" ]
                  then

                      echo "Adding metadata : $OBJECT"

                      mkdir -p delta-package/force-app/main/default/objects

                      cp -r \
                      "force-app/main/default/objects/$OBJECT" \
                      "delta-package/force-app/main/default/objects/"

                  else

                      echo "Warning : Metadata not found : $OBJECT"

                  fi

              done < objects.txt

          done < changedFiles.txt

      - name: Deployment Preview
        run: |

          echo "=========================="

          if [ -f delta-package/package/package.xml ]
          then

              cat delta-package/package/package.xml

          else

              echo "No package.xml found"

          fi

          echo "=========================="

      - name: Deploy Components

        run: |

          DEPLOY_CMD="sf project deploy start \
          --target-org TARGETORG \
          --test-level ${{ github.event.inputs.testLevel }} \
          --wait 30 \
          --ignore-conflicts"

          HAS_CHANGES=false


          if [ -f delta-package/package/package.xml ]
          then

              if grep -q "<members>" delta-package/package/package.xml
              then

                  DEPLOY_CMD="$DEPLOY_CMD --manifest delta-package/package/package.xml"

                  HAS_CHANGES=true

              fi

          fi


          if [ "$HAS_CHANGES" = false ]
          then

              echo "No deployable changes found"

              exit 0

          fi


          echo ""
          echo "Running Deploy"

          echo "$DEPLOY_CMD"

          eval $DEPLOY_CMD
