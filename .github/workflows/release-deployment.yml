name: Salesforce Smart Deployment

on:
  workflow_dispatch:
    inputs:
      deploymentType:
        description: "Deployment Type"
        required: true
        type: choice
        options:
          - SpecificPR
          - LatestMergeToMain

      prNumber:
        description: "PR Number"
        required: false

      targetEnvironment:
        description: "Target Org"
        required: true
        type: choice
        options:
          - DEV
          - SP
          - POD3

      testLevel:
        description: "Test Level"
        required: true
        type: choice
        options:
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
          - NoTestRun

permissions:
  contents: read
  pull-requests: read

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Inputs
        if: github.event.inputs.deploymentType == 'SpecificPR'
        run: |
          if [ -z "${{ github.event.inputs.prNumber }}" ]
          then
            echo "ERROR : PR Number required"
            exit 1
          fi

  deploy:

    runs-on: ubuntu-latest
    needs: validate

    environment:
      name: ${{ github.event.inputs.targetEnvironment }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CLI
        run: |
          npm install @salesforce/cli --global

          sudo apt-get update
          sudo apt-get install gh -y

          sf --version
          gh --version

      - name: Install Git Delta Plugin
        run: |
          yes | sf plugins install sfdx-git-delta

      - name: Authenticate Org
        run: |

          TARGET="${{ github.event.inputs.targetEnvironment }}"

          if [ "$TARGET" = "DEV" ]
          then
            echo "${{ secrets.DEV_ENVIRONMENT_SEC }}" > auth.txt

          elif [ "$TARGET" = "SP" ]
          then
            echo "${{ secrets.SP_ENVIRONMENT_SEC }}" > auth.txt

          else
            echo "${{ secrets.POD3_ENVIRONMENT_SEC }}" > auth.txt
          fi

          sf org login sfdx-url \
          --sfdx-url-file auth.txt \
          --alias TARGETORG

          rm auth.txt

      - name: Generate Delta Package

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          mkdir -p delta-package

          if [ "${{ github.event.inputs.deploymentType }}" = "SpecificPR" ]
          then

            PR="${{ github.event.inputs.prNumber }}"

            BASE=$(gh pr view "$PR" --json baseRefOid --jq '.baseRefOid')
            HEAD=$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')

          else

            PR=$(gh pr list \
            --state merged \
            --limit 1 \
            --json number \
            --jq '.[0].number')

            BASE=$(gh pr view "$PR" --json baseRefOid --jq '.baseRefOid')
            HEAD=$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')

          fi


          echo "BASE : $BASE"
          echo "HEAD : $HEAD"

          sf sgd source delta \
          --from "$BASE" \
          --to "$HEAD" \
          --output-dir delta-package \
          --source-dir force-app \
          --generate-delta


          echo ""
          echo "================================"
          echo "Apex Test Validation Report"
          echo "================================"

            git diff --name-only "$BASE" "$HEAD" > changedFiles.txt
                    
            while read FILE
            do
                    
              if [[ ! "$FILE" == *.cls ]]
              then
                continue
              fi
                    
              if [[ ! -f "$FILE" ]]
              then
                continue
              fi
                    
              if grep -qi "@IsTest" "$FILE"
              then
                continue
              fi
                    
              APEX_NAME=$(basename "$FILE" .cls)
                    
              echo ""
              echo "Changed Apex : $APEX_NAME"
                    
              MATCH_FOUND=false
                    
              EXACT_TEST="force-app/main/default/classes/${APEX_NAME}Test.cls"
                    
              if [ -f "$EXACT_TEST" ]
              then
                    
                echo "Matched Test : ${APEX_NAME}Test"
                echo "Status : FOUND (Exact Match)"
                    
                MATCH_FOUND=true
                    
              fi
                    
              if [ "$MATCH_FOUND" = false ]
              then
                    
                while read TESTFILE
                do
                    
                  if grep -qi "@IsTest" "$TESTFILE"
                  then
                    
                    if grep -q "$APEX_NAME\." "$TESTFILE"
                    then
                    
                      TESTNAME=$(basename "$TESTFILE" .cls)
                    
                      echo "Matched Test : $TESTNAME"
                      echo "Status : FOUND (Content Match)"
                    
                      MATCH_FOUND=true
                      break
                    
                    fi
                    
                  fi
                    
                done < <(find force-app/main/default/classes -name "*.cls")
                    
              fi
                    
              if [ "$MATCH_FOUND" = false ]
              then
                    
                echo "WARNING : No related test class found"
                echo "Deployment will continue"
                    
              fi
                    
                    done < changedFiles.txt

      - name: Deployment Preview
        run: |

          echo "========== PACKAGE =========="

          cat delta-package/package/package.xml || true

          echo "============================="

      - name: Deploy Components
        run: |

          sf project deploy start \
          --target-org TARGETORG \
          --manifest delta-package/package/package.xml \
          --test-level ${{ github.event.inputs.testLevel }} \
          --wait 30 \
          --ignore-conflicts
