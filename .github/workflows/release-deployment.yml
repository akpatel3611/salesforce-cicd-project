name: Salesforce Smart Deployment

on:
  workflow_dispatch:
    inputs:

      deploymentType:
        description: "Deployment Type"
        required: true
        type: choice
        options:
          - SpecificPR
          - SpecificComponent
          - FullDeploy

      prNumber:
        description: "PR Number only (Example: 41)"
        required: false

      componentName:
        description: "LWC Component Name (Example: accountViewer)"
        required: false

      targetEnvironment:
        description: "Target Org"
        required: true
        type: choice
        options:
          - DEV
          - SP
          - POD3


jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.targetEnvironment }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli --global


      - name: Verify CLI
        run: |
          sf --version


      - name: Install Delta Plugin
        run: |
          yes | sf plugins install sfdx-git-delta


      - name: Authenticate Org
        run: |

          if [ "${{ github.event.inputs.targetEnvironment }}" = "DEV" ]
          then
              echo "${{ secrets.DEV_ENVIRONMENT_SEC }}" > auth.txt

          elif [ "${{ github.event.inputs.targetEnvironment }}" = "SP" ]
          then
              echo "${{ secrets.SP_ENVIRONMENT_SEC }}" > auth.txt

          else
              echo "${{ secrets.POD3_ENVIRONMENT_SEC }}" > auth.txt
          fi

          sf org login sfdx-url \
          --sfdx-url-file auth.txt \
          --alias TARGETORG


      - name: Generate PR Package
        if: github.event.inputs.deploymentType == 'SpecificPR'

        run: |

          mkdir -p package

          echo "Fetching PR..."

          git fetch origin pull/${{ github.event.inputs.prNumber }}/merge:mergePR

          echo "Generating package..."

          sf sgd source delta \
          --from mergePR^1 \
          --to mergePR \
          --output-dir package

          echo "Generated package content"

          ls -R package || true


      - name: Validate Package
        if: github.event.inputs.deploymentType == 'SpecificPR'

        run: |

          if [ ! -f package/package.xml ]
          then

              echo "No metadata found in PR"

              exit 1

          fi


      - name: Deploy Metadata

        run: |

          TYPE="${{ github.event.inputs.deploymentType }}"

          if [ "$TYPE" = "SpecificComponent" ]
          then

              COMPONENT="${{ github.event.inputs.componentName }}"

              echo "Deploying component: $COMPONENT"

              sf project deploy start \
              --source-dir force-app/main/default/lwc/$COMPONENT \
              --target-org TARGETORG


          elif [ "$TYPE" = "SpecificPR" ]
          then

              echo "Deploying PR package"

              sf project deploy start \
              --manifest package/package.xml \
              --target-org TARGETORG


          else

              echo "Deploying full project"

              sf project deploy start \
              --source-dir force-app \
              --target-org TARGETORG

          fi
