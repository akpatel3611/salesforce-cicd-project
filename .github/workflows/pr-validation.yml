name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Workflow Started
        run: echo "Salesforce PR Validation Started"

      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli --global

      - name: Verify Salesforce CLI
        run: sf --version

      - name: Authenticate Salesforce Org
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > authFile.txt
          sf org login sfdx-url --sfdx-url-file authFile.txt --alias CICD

      - name: Verify Org Connection
        run: sf org list

      - name: Validate Deployment
        run: |
          sf project deploy validate \
          --source-dir force-app \
          --target-org CICDORG \
          --test-level RunLocalTests