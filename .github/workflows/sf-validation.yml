name: Salesforce Validation

on:
  pull_request:

jobs:
  validate-deployment:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Validate Salesforce Project Structure
        run: |
          echo "Checking Salesforce project structure"

          test -f sfdx-project.json || exit 1
          test -d force-app || exit 1

      - name: Validate Metadata Format
        run: |
          sf project list
